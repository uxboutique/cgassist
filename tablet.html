<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGAssist · Tablet</title>
<meta name="description" content="Prototipo CGAssist, versione tablet/desktop con sidebar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#ECEEF2; --page-text:#2B2E35; --page-muted:#6B707C; --page-card:#FFFFFF; --page-line:#D9DCE3;
  --blue:#375ECC; --blue-d:#2C4FB3; --blue-50:#EEF2FC;
  --text:#3B3B3B; --muted:#717171; --line:#E2E6F2; --bg:#F6F8FF; --white:#FFFFFF;
  --green:#0DA30A; --orange:#CA720E; --red:#B50505;
  --shadow:0 2px 8px rgba(33,51,115,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#15171C; --page-text:#E7E9EE; --page-muted:#9AA0AC; --page-card:#1F2229; --page-line:#2E323B; }
}
:root[data-theme="dark"]{ --page-bg:#15171C; --page-text:#E7E9EE; --page-muted:#9AA0AC; --page-card:#1F2229; --page-line:#2E323B; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page-bg);color:var(--page-text);font-family:'Montserrat','Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- barra prototipo ---------- */
.bar{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px}
.bar a.back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:19px;border:1.5px solid var(--page-line);
  background:var(--page-card);color:var(--page-text);text-decoration:none;font-size:13px;font-weight:600}
.bar a.back:hover{border-color:var(--blue)}
.bar .t{font-size:13px;font-weight:600;color:var(--page-muted)}
.bar .sp{flex:1}
.seg{display:flex;padding:3px;border-radius:21px;background:var(--page-card);border:1.5px solid var(--page-line)}
.seg button{height:32px;padding:0 14px;border:0;border-radius:16px;background:none;font-size:13px;font-weight:600;color:var(--page-muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--blue);color:#fff}
.seg button:not(.on):hover{color:var(--page-text)}

/* ---------- cornice dispositivo ---------- */
.stage{height:calc(100% - 64px);display:flex;align-items:center;justify-content:center;padding:0 24px 24px}
.dwrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;padding:14px;border-radius:40px;background:#0B0C0F;
  box-shadow:0 0 0 1.5px #3A3D45,0 40px 70px -24px rgba(20,24,35,.45),0 10px 24px rgba(20,24,35,.14)}
.device.desk{padding:0;border-radius:12px;background:#D5D8DF;box-shadow:0 0 0 1px #C2C6CE,0 40px 70px -24px rgba(20,24,35,.4)}
.device.desk::before{content:"";display:block;height:34px;border-radius:12px 12px 0 0;
  background:radial-gradient(circle at 18px 17px,#FF5F57 5px,transparent 5.5px),radial-gradient(circle at 36px 17px,#FEBC2E 5px,transparent 5.5px),radial-gradient(circle at 54px 17px,#28C840 5px,transparent 5.5px),#E6E8EC}
.screen{position:relative;overflow:hidden;border-radius:26px;background:var(--bg);container-type:inline-size;container-name:app}
.device.desk .screen{border-radius:0 0 12px 12px}
body.full .bar{display:none}
body.full .stage{height:100%;padding:0}
body.full .device{position:static;padding:0;border-radius:0;box-shadow:none;transform:none!important;background:none}
body.full .device::before{display:none}
body.full .dwrap{width:100%!important;height:100%!important}
body.full .screen{width:100%!important;height:100%!important;border-radius:0}

/* ---------- app ---------- */
.app{display:flex;height:100%;color:var(--text);font-size:14px}
.sb{width:264px;flex:none;background:#fff;border-right:1px solid var(--line);padding:28px 20px 24px;display:flex;flex-direction:column;gap:32px;overflow:auto}
.sb .logo{color:var(--blue);padding-left:12px}
.sb .logo svg{width:140px;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .lab{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);padding:0 12px 8px}
.ni{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--text);font-weight:500;font-size:14px;text-align:left;width:100%}
.ni svg{color:var(--muted);flex:none}
.ni:hover{background:var(--blue-50)}
.ni.on{background:var(--blue);color:#fff;font-weight:700}
.ni.on svg{color:#fff}
.sb .grow{flex:1}
.user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--blue-50)}
.av{width:40px;height:40px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.user b{display:block;font-size:14px}
.user small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.main{flex:1;min-width:0;overflow:auto;padding:32px 40px 48px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;align-items:center;gap:16px}
.hello{flex:1;min-width:0}
.hello h1{margin:0;font-size:28px;line-height:34px;font-weight:700}
.hello p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.search{width:300px;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font-size:14px}
.search:focus-within{border-color:var(--blue)}
.btn{height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--blue)}
.btn.sec:hover{background:var(--blue-50)}
.btn.sm{height:37px;padding:0 16px;min-width:114px}
.link{border:0;background:none;color:var(--blue);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:8px}
.kpi .l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;flex:none;background:var(--orange)}
.dot.ok{background:var(--green)}.dot.b{background:var(--blue)}.dot.r{background:var(--red)}
.kpi .v{font-size:32px;line-height:38px;font-weight:700}
.kpi .n{font-size:12px;color:var(--muted)}
.content{display:flex;flex-direction:column;gap:24px}
.side-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:stretch}
.hero .btn{margin-top:auto}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.panel{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:20px 20px 16px}
.ph h2{flex:1;margin:0;font-size:18px;font-weight:700}
.ph .c{font-size:13px;color:var(--muted)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px 100px 20px 118px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr.th{background:var(--bg);padding-top:10px;padding-bottom:10px;border-bottom:0;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.tr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{display:none;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.tr .pt,.tr .dt{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.th .pt{font-size:11px;color:inherit}
.tr .st{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.share{border:0;background:none;color:var(--blue);padding:0;display:grid;place-items:center;width:20px;height:20px}
.tr .btn{width:100%;min-width:0}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}
.hero{background:var(--blue);color:#fff;border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.plus{width:48px;height:48px;border-radius:24px;background:#fff;color:var(--blue);display:grid;place-items:center;border:0}
.hero h3{margin:0;font-size:20px;line-height:25px;font-weight:700}
.hero p{margin:0;font-size:14px;line-height:1.45;opacity:.9}
.hero .btn{width:100%;background:#fff;color:var(--blue);border-color:#fff}
.hero .btn:hover{background:var(--blue-50)}
.guide{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px}
.guide h3{margin:0;font-size:16px;font-weight:700}
.step{display:flex;gap:12px}
.step .num{width:28px;height:28px;border-radius:14px;background:var(--blue-50);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.step b{display:block;font-size:14px}
.step small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.filters{display:flex;gap:8px;padding:0 20px 16px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--text)}
.chip.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.tr .cd{font-size:12px;color:var(--muted);font-weight:400}
.view{display:flex;flex-direction:column;gap:28px;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- responsive (larghezza dello schermo simulato) ---------- */
@container app (max-width:1300px){
  .sb{width:232px;padding:24px 16px}
  .main{padding:28px 28px 40px}
  .tr{grid-template-columns:minmax(0,1fr) 160px 104px 96px 20px 118px}
}
@container app (max-width:1100px){
  .sb{width:84px;padding:24px 14px;align-items:center}
  .sb .logo{padding:0;width:44px;overflow:hidden}
  .sb .logo svg{width:140px}
  .nav .lab,.ni span,.user .who{display:none}
  .ni{width:56px;justify-content:center;padding:0}
  .user{padding:8px;background:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .search{width:220px}
}
@container app (max-width:900px){
  .main{padding:24px 24px 36px;gap:24px}
  .top{flex-wrap:wrap}
  .hello{flex-basis:100%}
  .search{flex:1;width:auto}
  .tr{grid-template-columns:minmax(0,1fr) 100px 92px 20px 112px}
  .tr .pt{display:none}
  .tr .nm small{display:block}
  .side-col{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- modale ---------- */
.ov{position:absolute;inset:0;background:rgba(20,24,40,.45);display:grid;place-items:center;padding:24px;z-index:5;animation:fade .2s}
.modal{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px;color:var(--text);box-shadow:0 30px 60px -20px rgba(20,24,40,.45)}
.modal h3{margin:0;font-size:20px;font-weight:700}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
</style>
</head>

  <a class="back" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Cambia dispositivo</a>
  <span class="t">Tablet · layout con sidebar</span>

</div>
<div class="stage">
  <div class="dwrap" id="dwrap">
    <div class="device" id="device"><div class="screen" id="screen"><div class="app" id="app"></div></div></div>
  </div>
</div>

const DOC = { name:'Dr. Mario Rossi', ini:'MR', centro:'Centro Firenze' };

function loadPatients() {
  try { const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (o && o.v === 1 && Array.isArray(o.patients) && o.patients.length) return o.patients; } catch (e) {}
  return demo();
}
const PATS = loadPatients();
const isDraft = p => p.assessment.status !== 'validated';
const fullName = p => `${p.nome} ${p.cognome}`;
const pad2 = n => String(n).padStart(2, '0');
function when(iso, rel) {
  if (!iso) return '—';
  const d = new Date(iso), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  if (rel && diff === 0) return `Oggi ${hm}`;
  if (rel && diff === 1) return `Ieri ${hm}`;
  return `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}-${d.getFullYear()}`;
}
const byDate = k => (a, b) => new Date(b.assessment[k] || 0) - new Date(a.assessment[k] || 0);
const drafts = PATS.filter(isDraft).sort(byDate('updatedAt'));
const done = PATS.filter(p => !isDraft(p)).sort(byDate('validatedAt'));

/* ---------- viste ---------- */
const st = { view:'home', q:'', filter:'all' };
function row(p) {
  const dr = isDraft(p);
  return `<div class="tr" role="row">
    <div class="nm" role="cell">${esc(fullName(p))}<small>${esc(p.patologia)}</small></div>
    <div class="pt" role="cell">${esc(p.patologia)}</div>
    <div class="st" role="cell"><span class="dot ${dr ? '' : 'ok'}"></span>${dr ? 'In corso' : 'Validata'}</div>
    <div class="dt" role="cell">${dr ? when(p.assessment.updatedAt, true) : when(p.assessment.validatedAt)}</div>
    <button class="share" data-act="share" data-code="${esc(p.code)}" aria-label="Condividi ${esc(fullName(p))}">${ic('share', 20)}</button>
    <button class="btn sm ${dr ? '' : 'sec'}" data-act="open" data-code="${esc(p.code)}">${dr ? 'Continua' : 'Visualizza'}</button>
  </div>`;
}
const head = (dateLab) => `<div class="tr th" role="row"><span>PAZIENTE</span><span class="pt">PATOLOGIA</span><span>STATO</span><span>${dateLab}</span><span></span><span>AZIONI</span></div>`;
function panel(title, list, dateLab, all) {
  const rows = list.length ? list.map(row).join('') : '<div class="empty">Nessun paziente trovato.</div>';
  return `<section class="panel" role="table" aria-label="${title}">
    <div class="ph"><h2>${title}</h2><span class="c">${list.length} ${list.length === 1 ? 'paziente' : 'pazienti'}</span>${all ? '<button class="link" data-act="all">Tutte</button>' : ''}</div>
    ${head(dateLab)}${rows}</section>`;
}
const match = p => !st.q || `${fullName(p)} ${p.patologia} ${p.code}`.toLowerCase().includes(st.q.toLowerCase());
function greet() { const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
function topbar(title, sub) {
  return `<div class="top">
    <div class="hello"><h1>${title}</h1><p>${sub}</p></div>
    <label class="search">${ic('search', 20)}<input id="q" type="search" placeholder="Cerca paziente…" value="${esc(st.q)}" aria-label="Cerca paziente"></label>
    <button class="btn" data-act="new">${ic('plus', 20)}Censisci nuovo paziente</button>
  </div>`;
}
function home() {
  const today = new Date().toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const weekAgo = Date.now() - 7 * 864e5;
  const recent = drafts.filter(p => new Date(p.assessment.updatedAt) > weekAgo).length;
  const fu = PATS.filter(p => (p.followups || []).length).length;
  const last = done[0];
  const kpi = (l, v, n, dot) => `<div class="kpi"><span class="l"><span class="dot ${dot}"></span>${l}</span><span class="v">${v}</span><span class="n">${n}</span></div>`;
  return `<div class="view">
    ${topbar(`${greet()}, ${DOC.name}`, `${DOC.centro} · ${today}`)}
    <div class="kpis">
      ${kpi('Valutazioni in corso', drafts.length, recent ? `${recent} ${recent === 1 ? 'aggiornata' : 'aggiornate'} negli ultimi 7 giorni` : 'Nessun aggiornamento recente', '')}
      ${kpi('Valutazioni validate', done.length, last ? `Ultima il ${when(last.assessment.validatedAt)}` : 'Nessuna validazione', 'ok')}
      ${kpi('Pazienti censiti', PATS.length, DOC.centro, 'b')}
      ${kpi('Follow-up registrati', fu, 'Pazienti con almeno un follow-up', 'b')}
    </div>
    <div class="content">
      <div class="side-col">
        <div class="hero">
          <button class="plus" data-act="new" aria-label="Censisci un nuovo paziente">${ic('plus')}</button>
          <h3>Censisci un nuovo paziente</h3>
          <p>Registra un nuovo paziente anonimo per iniziare la valutazione geriatrica.</p>
          <button class="btn" data-act="new">Inizia ora</button>
        </div>
        <div class="guide">
          <h3>Come funziona</h3>
          <div class="step"><span class="num">1</span><div><b>Censisci il paziente</b><small>Codice anonimo e patologia di riferimento</small></div></div>
          <div class="step"><span class="num">2</span><div><b>Compila la valutazione</b><small>BADL, MNA-SF, SPPB e diario clinico</small></div></div>
          <div class="step"><span class="num">3</span><div><b>Valida e monitora</b><small>Risultati, condivisione e follow-up</small></div></div>
        </div>
      </div>
      <div class="col">
        ${panel('Valutazioni in corso', drafts.filter(match).slice(0, 5), 'AGGIORNATA', true)}
        ${panel('Valutazioni concluse', done.filter(match).slice(0, 5), 'VALIDATA IL', true)}
      </div>
    </div>
  </div>`;
}
function patients() {
  const list = PATS.filter(match).filter(p => st.filter === 'all' || (st.filter === 'draft') === isDraft(p))
    .sort((a, b) => new Date(b.assessment.updatedAt) - new Date(a.assessment.updatedAt));
  const chip = (k, l, n) => `<button class="chip ${st.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}" aria-pressed="${st.filter === k}">${l} · ${n}</button>`;
  return `<div class="view">
    ${topbar('Pazienti', `${PATS.length} pazienti censiti · ${DOC.centro}`)}
    <section class="panel" role="table" aria-label="Elenco pazienti">
      <div class="ph"><h2>Elenco pazienti</h2><span class="c">${list.length} risultati</span></div>
      <div class="filters">${chip('all', 'Tutti', PATS.length)}${chip('draft', 'In corso', drafts.length)}${chip('done', 'Validate', done.length)}</div>
      ${head('ULTIMA MODIFICA')}${list.length ? list.map(row).join('') : '<div class="empty">Nessun paziente trovato.</div>'}
    </section>
  </div>`;
}
function render(keepFocus) {
  const app = document.getElementById('app');
  const navBtn = (v, icon, label) => `<button class="ni ${st.view === v ? 'on' : ''}" data-act="nav" data-v="${v}" title="${label}" ${st.view === v ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></button>`;
  app.innerHTML = `<aside class="sb">
      <div class="logo">${LOGO}</div>
      <nav class="nav" aria-label="Menu principale"><span class="lab">MENU</span>
        ${navBtn('home', 'home', 'Home')}${navBtn('patients', 'patients', 'Pazienti')}
        <button class="ni" data-act="new" title="Nuova valutazione">${ic('plus')}<span>Nuova valutazione</span></button>
        <button class="ni" data-act="account" title="Account">${ic('user')}<span>Account</span></button>
      </nav>
      <div class="grow"></div>
      <div class="user"><span class="av">${DOC.ini}</span><span class="who"><b>${DOC.name}</b><small>${DOC.centro}</small></span></div>
      <a class="ni" href="./" title="Esci" style="text-decoration:none">${ic('logout')}<span>Esci</span></a>
    </aside>
    <main class="main" id="main">${st.view === 'home' ? home() : patients()}</main>`;
  if (keepFocus) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function modal(title, text, primary) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${text}</p>
    <div class="acts"><button class="btn sec" data-x>Chiudi</button>${primary ? `<a class="btn" href="mobile.html" style="text-decoration:none">Apri prototipo mobile</a>` : ''}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) ov.remove(); });
  document.getElementById('screen').appendChild(ov);
  ov.querySelector('[data-x]').focus();
}
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  const p = PATS.find(x => x.code === b.dataset.code);
  if (a === 'nav') { st.view = b.dataset.v; render(); }
  else if (a === 'all') { st.view = 'patients'; render(); }
  else if (a === 'filter') { st.filter = b.dataset.f; render(); }
  else if (a === 'new') modal('Censisci un nuovo paziente', 'Il censimento e la compilazione della valutazione sono già navigabili nel prototipo mobile. In questa versione tablet è disegnata la home.', true);
  else if (a === 'open' && p) modal(fullName(p), `${esc(p.code)} · ${esc(p.patologia)}.<br>La scheda ${isDraft(p) ? 'di valutazione in corso' : 'con i risultati validati'} è navigabile nel prototipo mobile.`, true);
  else if (a === 'share' && p) modal('Condividi valutazione', `La condivisione della valutazione di ${esc(fullName(p))} è disponibile nel prototipo mobile.`, true);
  else if (a === 'account') modal('Account', `${DOC.name} · Medico operatore · ${DOC.centro}`, false);
});
document.getElementById('app').addEventListener('input', e => { if (e.target.id === 'q') { st.q = e.target.value; render(true); } });

/* ---------- formato schermo + adattamento ---------- */
const MODES = { land:{ w:1194, h:834 }, port:{ w:834, h:1194 }, desk:{ w:1440, h:900 } };
let mode = 'land';
try { mode = localStorage.getItem('cgassist-tablet-mode') || 'land'; } catch (e) {}
if (!MODES[mode]) mode = 'land';
const full = new URLSearchParams(location.search).has('full') || (matchMedia('(pointer:coarse)').matches && innerWidth >= 744 && innerWidth <= 1400);
if (full) document.body.classList.add('full');
function fit() {
  if (full) return;
  const m = MODES[mode], dev = document.getElementById('device'), scr = document.getElementById('screen');
  dev.classList.toggle('desk', mode === 'desk');
  scr.style.width = m.w + 'px'; scr.style.height = m.h + 'px';
  const fw = mode === 'desk' ? m.w : m.w + 28, fh = mode === 'desk' ? m.h + 34 : m.h + 28;
  const s = Math.min(1, (innerWidth - 48) / fw, (innerHeight - 64 - 24) / fh);
  dev.style.transform = `scale(${s})`;
  const w = document.getElementById('dwrap'); w.style.width = fw * s + 'px'; w.style.height = fh * s + 'px';
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; try { localStorage.setItem('cgassist-tablet-mode', mode); } catch (e) {}
  fit();
});
addEventListener('resize', fit);
render(); fit();
</script>
