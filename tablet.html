<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGAssist · Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page-bg:#ECEEF2; --page-text:#2B2E35; --page-muted:#6B707C; --page-card:#FFFFFF; --page-line:#D9DCE3;
  --blue:#375ECC; --blue-d:#2C4FB3; --blue-50:#EEF2FC; --blue-100:#DCE4F8; --bar-base:#AFC0E6;
  --text:#3B3B3B; --muted:#717171; --line:#E2E6F2; --track:#EEF0F5; --ph:#717171; --grab:#B8BFD3; --red2:#C8372D; --bg:#F6F8FF; --white:#FFFFFF;
  --green:#058733; --green-bg:#E7F4EC; --orange:#B3610B; --orange-dot:#CA720E; --orange-bg:#FBF1E6;
  --red:#B50505; --disabled:#F5F5F5; --disabled-text:#717171; --ink:#21211F;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#15171C; --page-text:#E7E9EE; --page-muted:#9AA0AC; --page-card:#1F2229; --page-line:#2E323B; }
}
:root[data-theme="dark"]{ --page-bg:#15171C; --page-text:#E7E9EE; --page-muted:#9AA0AC; --page-card:#1F2229; --page-line:#2E323B; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--page-bg);color:var(--page-text);
  font-family:'Montserrat','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- stage + device frame ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
.side{width:300px;flex:none}
.side .brand{display:flex;align-items:center;gap:10px;color:var(--blue);margin-bottom:6px}
.side .brand svg{width:150px;height:auto}
.side h2{font-size:15px;font-weight:600;margin:0 0 18px;color:var(--page-muted)}
.side p{font-size:13.5px;line-height:1.55;margin:0 0 12px;max-width:34ch}
.side .acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.side .sbtn{height:44px;border-radius:22px;border:1.5px solid var(--page-line);background:var(--page-card);color:var(--page-text);
  font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,transform .12s}
.side a.sbtn{text-decoration:none}
.side .sbtn:hover{border-color:var(--blue)}
.side .sbtn:active{transform:scale(.98)}
.side .sbtn.warn{border-color:var(--orange);color:var(--orange)}
.side .fine{font-size:12px;color:var(--page-muted);margin-top:18px}
.dwrap{position:relative;flex:none;width:calc(424px * var(--s,1));height:calc(878px * var(--s,1))}
.device{position:absolute;left:0;top:0;width:424px;height:878px;transform:scale(var(--s,1));transform-origin:0 0;
  border-radius:68px;padding:6px;
  background:linear-gradient(135deg,#FAFAFB 0%,#C9CCD2 18%,#F2F3F5 38%,#B8BBC2 62%,#ECEDF0 82%,#C4C7CD 100%);
  box-shadow:0 0 0 1px #A9ADB4 inset,0 2px 1px rgba(255,255,255,.7) inset,0 40px 70px -20px rgba(20,24,35,.35),0 10px 24px rgba(20,24,35,.12)}
.device .key{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#B4B7BE,#E9EAED,#B4B7BE)}
.device .k1{left:-4px;top:150px;height:34px}.device .k2{left:-4px;top:210px;height:64px}.device .k3{left:-4px;top:290px;height:64px}.device .k4{right:-4px;top:240px;height:96px}
.bezel{width:100%;height:100%;background:#08090B;border-radius:62px;padding:11px}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg);isolation:isolate;
  color:var(--text);font-size:14px;transform:translateZ(0)}
.stage.full{padding:0;gap:0}
.stage.full .side{display:none}
.stage.full .dwrap{width:100%;height:100%}
.stage.full .device{position:static;width:100%;height:100%;transform:none;border-radius:0;padding:0;background:none;box-shadow:none}
.stage.full .device .key{display:none}
.stage.full .bezel{border-radius:0;padding:0;background:var(--blue)}
.stage.full .screen{width:100%;height:100%;border-radius:0}
.stage.full .sb{display:none}
html.full-mode,html.full-mode body{background:linear-gradient(var(--blue) 50%,#fff 50%)}
.stage.full .hdr{padding-top:12px}
.stage.full .hero{padding-top:21px}

/* ---------- views ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.sb{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 3px 16px;
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:16px;color:#fff;background:var(--blue)}
.sb>span:first-child{width:54px;text-align:center;letter-spacing:-.32px}
.sb .ico{display:flex;gap:6px;align-items:center;padding-bottom:0}
.hdr{flex:none;background:var(--blue);color:#fff;padding:0 16px 20px}
.hdr .sb{margin:0 -16px}
.hdr .top{display:flex;align-items:center;justify-content:space-between;min-height:25px;margin-top:14px}
.back,.saveexit{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:#fff;font-weight:500;font-size:14px;line-height:17px;padding:4px 0}
.saveexit{margin-left:auto;gap:8px}
.hdr .trow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:14px}
.hdr .trow .iconbtn{padding:0;margin-top:4px}
.hdr h1{font-size:24px;line-height:29px;font-weight:700;margin:0;overflow-wrap:anywhere}
.hdr .sub{font-size:14px;line-height:17px;margin-top:4px}
.hdr .sub.sm{font-size:12px;line-height:15px;margin-top:2px}
.iconbtn{background:none;border:0;color:inherit;padding:4px;display:grid;place-items:center;border-radius:50%}
.stepper{margin-top:20px}
.stepper .lab{display:flex;justify-content:space-between;font-size:12px;line-height:15px;font-weight:500;margin-bottom:8px}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.5);overflow:hidden}
.segs span i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .45s var(--ease)}
.segs span.on i{width:100%}

.body{padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:12px;padding:18px}
.card h3{font-size:16px;line-height:20px;font-weight:700;margin:0;color:var(--text)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead .cnt{font-size:13px;line-height:16px;font-weight:600;color:var(--muted)}
.csegs{display:flex;gap:4px;margin:12px 0 0}
.csegs span{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.csegs span i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s var(--ease)}
.csegs span.on i{width:100%}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:16px;padding:0}
.kvs{display:flex;flex-direction:column;gap:8px}
.kv span:first-child{color:var(--muted)} .kv b{font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:16px}
.grid2 small{display:block;font-size:12px;line-height:15px;color:var(--muted);margin-bottom:2px}
.grid2 b{font-size:14px;line-height:17px;font-weight:600}

/* buttons */
.btn{height:52px;border-radius:26px;border:1.5px solid transparent;font-weight:500;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  flex:1;transition:transform .12s,background-color .2s,color .2s,border-color .2s,opacity .2s;white-space:nowrap;padding:0 18px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.secondary{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.danger{background:#fff;color:var(--red2);border-color:var(--red);height:45px;font-size:15px;font-weight:600}
.btn[disabled]{background:var(--disabled);color:var(--disabled-text);border-color:transparent;pointer-events:none}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--muted)}
.btn.sm{height:37px;border-radius:100px;font-size:14px;font-weight:500;flex:none;padding:0 24px}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.link{background:none;border:0;color:var(--blue);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.bb{flex:none;background:#fff;padding:14px 16px 30px;border-top:1px solid var(--line)}
.bb.nob{border-top:0}
.bb .btns{display:flex;gap:12px}
.bb .cap{font-size:12px;line-height:15px;color:var(--muted);text-align:center;margin-top:12px}

/* badges + status */
.badge{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px 0 8px;border-radius:100px;border:1px solid currentColor;font-size:12px;line-height:15px;font-weight:600;background:#fff;white-space:nowrap}
.badge.wip{height:25px}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--green)} .badge.wip{color:var(--orange)}
.metaline{font-size:12px;line-height:16px;color:var(--muted)}
.st{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted);padding-top:2px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--orange-dot);flex:none}
.st.ok i{background:#0DA30A}
.st b{color:var(--text);font-weight:500;margin-left:-4px}
.c-ok{color:var(--green)} .c-wip{color:var(--orange)} .c-bad{color:var(--red)}

/* module rows */
.mrows{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.mrow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:64px}
.mrow .ck{width:32px;height:32px;color:var(--green);flex:none;animation:pop .4s var(--ease)}
.mrow .tx{flex:1;min-width:0}
.mrow b{display:block;font-size:15px;line-height:18px;font-weight:600}
.mrow .s1{display:block;font-size:12px;line-height:15px;font-weight:500;color:var(--muted);margin-top:2px}
.mrow .s1.done{color:var(--green);font-weight:500}
.mrow .s1.part{color:var(--orange);font-weight:500}
.mrow small{display:block;font-size:10px;line-height:12px;color:var(--muted);margin-top:8px}
.mrow small b{display:inline;font-size:10px;line-height:12px;font-weight:700;color:var(--muted)}
.mrow .chev{color:var(--blue);flex:none}
.lockline{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-top:12px;line-height:19px}
.lockline svg{flex:none;margin-top:2px}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;line-height:16px;font-weight:500;color:var(--text)}
.box{height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(55,94,204,.14)}
.box input{border:0;outline:0;background:transparent;flex:1;min-width:0;width:100%;font-size:15px;color:var(--text)}
.box input::placeholder{color:var(--ph)}
.box .unit{font-size:14px;color:var(--muted);flex:none}
.box.ro{background:#EEF0F5;color:var(--muted);font-size:15px}
.box.sel{justify-content:space-between;cursor:pointer;width:100%;font-size:15px;text-align:left}
.box.sel .ph{color:var(--ph)}
.box.sel svg{color:var(--blue);transition:transform .25s var(--ease)}
.box.sel.open svg{transform:rotate(180deg)}
.dd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease);margin-top:-6px}
.dd.open{grid-template-rows:1fr}
.dd>div{overflow:hidden}
.dd ul{list-style:none;margin:6px 0 0;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.dd li button{width:100%;text-align:left;background:none;border:0;padding:11px 10px;border-radius:8px;font-size:14px}
.dd li button:hover,.dd li button.on{background:var(--blue-50);color:var(--blue);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.fgrid.g8{gap:8px}
.fgrid>*{min-width:0}
input[type=date]{color:var(--text)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}

/* date picker */
.box.datef span{font-size:15px}
.box.datef svg{color:var(--blue)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.calnav b{font-size:16px;font-weight:700;text-transform:capitalize}
.calnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--blue);display:grid;place-items:center;transition:background-color .15s,opacity .2s}
.calnav button:hover{background:var(--blue-50)}
.calnav button[disabled]{opacity:.3;pointer-events:none}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);margin-top:16px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.calwrap{overflow:hidden}
.caldays{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:44px;row-gap:2px;margin-top:6px;min-height:274px}
.caldays button{width:42px;height:42px;justify-self:center;align-self:center;border-radius:50%;border:0;background:none;font-size:14px;font-weight:500;color:var(--text);transition:background-color .15s,color .15s}
.caldays button:hover{background:var(--blue-50)}
.caldays button.today{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);font-weight:700}
.caldays button.on{background:var(--blue);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(55,94,204,.3);animation:pop .3s var(--ease)}
.caldays button[disabled]{color:#C9CDD5;pointer-events:none}
/* options */
.qtitle{font-size:16px;font-weight:600;margin:0 0 4px;line-height:20px}
.opt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;text-align:left;font-size:14px;line-height:17px;transition:border-color .2s,box-shadow .2s,background-color .2s}
.opt.on{border-color:var(--blue);box-shadow:0 0 0 .5px var(--blue) inset;font-weight:500}
.opt.big{min-height:48px;padding:0 12px;font-size:15px}
.opt.big.on{font-weight:600}
.opt.left{justify-content:flex-start}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);position:relative;flex:none;background:#fff}
.on>.rd,.rd.on{border-width:1.5px}
.rd::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.on>.rd::after,.rd.on::after{transform:scale(1)}
.cb{width:18px;height:18px;border-radius:3px;border:2px solid var(--blue);display:grid;place-items:center;flex:none;transition:background-color .15s;background:#fff}
.cb svg{color:#fff;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.on>.cb,.on .cb{background:var(--blue)}
.on>.cb svg,.on .cb svg{transform:scale(1)}
.yn{display:flex;align-items:center;gap:8px}
.yn button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px;border-radius:8px;font-size:14px;line-height:17px;color:var(--text)}
.yn button.on{color:var(--text);font-weight:600}
.badlrow{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 16px;font-size:15px;line-height:18px;font-weight:500;transition:border-color .2s}
.badlrow.done{border-color:var(--line)}
.qcard{background:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.qcard .qh{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.qcard h4{margin:0;font-size:16px;line-height:20px;font-weight:600}
.qcard .qs{font-size:13px;line-height:19px;color:var(--muted)}
.qsub{font-size:14px;line-height:20px;font-weight:600;margin-top:4px}
.qgroup{display:flex;flex-direction:column;gap:12px;padding:0 12px}
.qgroup .opts{display:flex;flex-direction:column;gap:10px}
.scorebar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 0;font-size:14px;font-weight:500;line-height:17px;color:var(--muted)}
.scorebar b{font-size:20px;line-height:24px;font-weight:700;color:var(--text);display:inline-block}
.bump{animation:bump .45s var(--ease)}
.body.g10{gap:10px;padding-top:24px}.body.g10 .scorebar{padding-top:10px}.body.g10 .agecard{margin-top:10px}
.body.g20{gap:20px}.body.g20 .scorebar{padding-top:0}
.body.g20 .qcard .field+div .chrono{margin-top:0}
.chrono{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--blue);font-weight:500;font-size:14px;line-height:17px;padding:4px 0}
.chrono.run{color:var(--red)}
.chrono.run svg{animation:spin 2s linear infinite}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.expand.open{grid-template-rows:1fr}
.expand>div{overflow:hidden}
.optgroup{border:1px solid var(--line);border-radius:10px;background:#fff;transition:border-color .2s}
.optgroup.on{border-color:var(--blue);box-shadow:0 0 0 .5px var(--blue) inset}
.optgroup .opt{border:0;box-shadow:none}
.optgroup .inner{border-top:1px solid #D0D4DE;margin:0 14px;padding:12px 0 12px}
.agecard{background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
/* "Nessuna delle precedenti": separata dalla lista */
.opt.none{margin-top:20px}
.body .opt.none+.agecard{margin-top:20px}
.body .opt.none~.scorebar{padding-top:20px}
/* riga con toggle SÌ/NO (eseguibile / eseguito) */
.tgrow{width:100%;min-height:49px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;font-size:14px;line-height:17px;color:var(--text)}
.tgrow>span:first-child{flex:1;min-width:0}
.tg{position:relative;flex:none;width:49px;height:23px;border-radius:48px;background:var(--blue);transition:background-color .2s}
.tg i{position:absolute;top:5.5px;left:31px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .25s var(--ease)}
.tg b{position:absolute;top:4px;left:6px;width:21px;font-size:12px;line-height:15px;font-weight:500;color:#fff;text-align:center;transition:left .25s var(--ease)}
.tg.off{background:var(--text)}
.tg.off i{left:6px}
.tg.off b{left:22px}
.qcard .tbody{display:flex;flex-direction:column;gap:14px;margin-top:16px}
/* campi disabilitati (test non eseguibile / esame non eseguito) */
.field.dis>label,.field.dis>.flabel{color:var(--muted)}
.field.dis .box{background:#EEF0F5;pointer-events:none}
.field.dis .box input{color:var(--muted)}
.field.dis .box.datef svg{color:var(--muted)}
.chrono[disabled]{color:var(--muted);pointer-events:none}
.agecard .between>span{font-size:16px;line-height:20px}
.agecard .between b{color:var(--blue);font-size:14px;font-weight:700}
.agecard .metaline{font-size:12px;line-height:17px}

/* notes */
.nota{display:flex;gap:10px;align-items:center;border:1px solid var(--blue);border-radius:10px;padding:8px;font-size:10px;line-height:16px;text-align:left;background:#fff;color:var(--text)}
.nota svg{flex:none;color:var(--blue)}
.nota.warn{border-color:var(--orange)} .nota.warn svg{color:var(--orange)}

/* lists */

/* home (da frame Figma "03 Home") */
.hero{background:var(--blue);padding:19px 16px 51px;color:#fff}

.nav .ni.on .f{opacity:1;transform:none}
.nav .ni::after{content:'';position:absolute;top:25px;left:10px;width:4px;height:4px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}

/* search + chips */

.fbtn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);display:grid;place-items:center;position:relative;flex:none}

.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}

/* results */
.acc{background:#fff;border-radius:12px;padding:16px}

.frow{display:flex;justify-content:space-between;align-items:center;padding:0;gap:10px}
.frow>div{display:flex;flex-direction:column;gap:4px}
.frow b{display:block;font-size:14px;line-height:17px;font-weight:600}
.frow small{font-size:12px;line-height:16px;color:var(--muted)}
.frow .v{font-size:12px;line-height:15px;color:var(--muted);text-align:right;white-space:nowrap}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0;font-size:14px;line-height:17px;font-weight:600}

.foot{text-align:center;font-size:12px;color:var(--muted);line-height:15px;padding:4px 16px 8px}

.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.16s}.stagger>*:nth-child(4){animation-delay:.24s}
.stagger>*:nth-child(5){animation-delay:.32s}.stagger>*:nth-child(6){animation-delay:.4s}.stagger>*:nth-child(7){animation-delay:.46s}

/* patient */
.rprof{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:12px;line-height:16px;margin-top:4px}

.rescard{background:#fff;border-radius:12px;padding:18px}
.rescard h3{line-height:20px}

.rgroup{background:#fff;border-radius:12px;padding:18px}

.ind{background:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:2px}
.ind h3{font-size:16px;line-height:21px;font-weight:700;margin:0}

.bb .nota{margin-bottom:10px}
.prisk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 0 9px}
.prisk small{font-size:12px;line-height:16px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.card.pad16{padding:16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}

.tl{margin-top:16px;display:flex;flex-direction:column;gap:20px}

.tlrow+.tlrow::before{content:'';position:absolute;left:7px;top:-31px;height:42px;width:2px;border-radius:10px;background:var(--line)}
.tlrow .dot{width:16px;height:16px;border-radius:50%;background:var(--blue);flex:none;position:relative;z-index:1}

.paper{background:#fff;border-radius:12px;padding:20px 18px;box-shadow:0 1px 0 var(--line)}

.rrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}

.rrow .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

/* account */
.prof{display:flex;align-items:center;gap:14px}

.card.prof{padding:16px}
.prof b{font-size:17px;line-height:21px;font-weight:700;display:block}
.prof small{display:block;font-size:13px;line-height:16px;color:var(--muted);margin-top:2px}
.card.acct{padding:16px}
.card.acct h3{margin-bottom:4px}
.arow{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 0;text-align:left;font-size:14px;line-height:17px;font-weight:500;border-bottom:1px solid var(--line)}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(11,21,51,.5);opacity:0;transition:opacity .3s;z-index:60}
.ov.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 34px;max-height:92%;overflow-y:auto;
  transform:translateY(102%);transition:transform .42s var(--ease);scrollbar-width:none}
.sheet.in{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 16px}
.sheet h2{font-size:20px;line-height:24px;font-weight:700;margin:0}

.sheet .form{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.sheet .form.g24{gap:24px}
.sheet .btns{display:flex;gap:12px;margin-top:16px}
/* liberatoria (step 0 del censimento) */
.consent{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px 16px;max-height:290px;overflow-y:auto;font-size:13px;line-height:19px;color:var(--text);scrollbar-width:thin}
.consent h3{font-size:14px;line-height:18px;font-weight:600;margin:14px 0 4px}
.consent h3:first-child{margin-top:0}

.consent p:last-child{margin-bottom:0}
.sheet .opt.agree{margin-top:16px;align-items:flex-start;line-height:19px}

.modal{position:absolute;left:24px;right:24px;top:50%;z-index:61;background:#fff;border-radius:20px;padding:24px 20px 20px;text-align:center;
  transform:translateY(-46%) scale(.94);opacity:0;transition:transform .34s cubic-bezier(.2,.9,.3,1.15),opacity .22s}
.modal.in{transform:translateY(-50%) scale(1);opacity:1}
.modal h2{font-size:20px;font-weight:700;margin:12px 0 12px;line-height:24px}

.modal .mbtns{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:32px}
.modal .mbtns .link{font-size:16px;text-decoration:none;padding:4px 0}
.modal .mbtns .btn{width:100%;flex:none}
.circ{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--blue);color:var(--blue);display:grid;place-items:center;margin:0 auto}
.circ.ok{border-color:var(--green);color:var(--green)}
.circ.red{border-color:var(--red);color:var(--red)}
.circ.ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .55s .2s var(--ease) forwards}
.codebox{border-radius:14px;padding:18px 16px;text-align:center;margin-top:32px;display:flex;flex-direction:column;gap:6px;align-items:center}
.codebox small{font-size:11px;line-height:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.codebox .crow2{display:flex;align-items:center;gap:12px}

.ferr{font-size:12px;line-height:16px;color:var(--red2);font-weight:500}
.box.bad{border-color:var(--red2)}

.codebox .cp{background:none;border:0;padding:0;color:var(--blue);display:grid}
.codebox .d{font-size:13px;line-height:16px;color:var(--text)}
.codebox .link{margin-top:10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.calc{display:flex;flex-direction:column;gap:10px;margin:18px auto 4px;text-align:left;width:max-content}

.calc .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .25s}
.calc div.done .dot{background:var(--green);border-color:var(--green);color:#fff}

.ring{width:56px;height:56px;margin:0 auto;border-radius:50%;border:4px solid var(--blue-100);border-top-color:var(--blue);animation:spin .9s linear infinite}

/* 2fa + login */
.loginhero{flex:none;background:var(--blue);color:#fff;text-align:center;padding:0 24px 48px}

.center{text-align:center}

/* toast */
.toast{position:absolute;left:16px;right:16px;top:60px;z-index:90;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;
  transform:translateY(-24px);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.18)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* scheda paziente · gauge rischio + lista indici */
.rcard{display:flex;flex-direction:column;gap:24px}
.gwrap{display:flex;flex-direction:column;gap:12px}
.gauge{position:relative;width:100%;max-width:326px;aspect-ratio:326/142;margin:0 auto}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gz{fill:none;stroke-width:17.6;opacity:.3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .62s var(--ease) var(--d),opacity .5s var(--ease)}
.gauge.go .gz{stroke-dashoffset:0}
.gauge.nt *{transition:none!important}

   COMPILAZIONE · barra laterale delle sezioni
   ========================================================= */
.wiz{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;padding:24px 40px 40px;align-items:start}
.rail{position:sticky;top:0;display:flex;flex-direction:column;background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 8px rgba(33,51,115,.06)}
.ritem{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--text)}
.ritem:hover{background:var(--bg)}
.ritem.on{background:var(--blue-50)}
.ritem+.ritem::before{content:'';position:absolute;left:25px;top:-10px;height:20px;width:2px;background:var(--line)}
.rn{position:relative;z-index:1;width:28px;height:28px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.ritem.part .rn{color:var(--orange);box-shadow:inset 0 0 0 1.5px var(--orange)}
.ritem.done .rn{background:#0DA30A;color:#fff;box-shadow:none}
.ritem.on .rn{background:var(--blue);color:#fff;box-shadow:none}
.rt{min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-size:14px;line-height:18px;font-weight:600}
.ritem.on .rt b{color:var(--blue);font-weight:700}
.rt small{font-size:12px;line-height:15px;color:var(--muted)}
.ritem.done .rt small{color:var(--green)}
.ritem.part .rt small{color:var(--orange)}
.wmain{min-width:0;max-width:820px;display:flex;flex-direction:column;gap:20px}
.whead .wc{font-size:13px;font-weight:600;color:var(--blue)}
.whead h2{margin:4px 0 0;font-size:22px;line-height:28px;font-weight:700}
.whead p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.wmain .body{padding:0}
.wmain .body.g10{padding-top:0}
.wmain .body.grid2c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:start}
.wmain .body.grid2c>.qtitle,.wmain .body.grid2c>.scorebar,.wmain .body.grid2c>.agecard,.wmain .body.grid2c>.opt.none,.wmain .body.grid2c>div:not(.optgroup):not(.field):not(.badlrow){grid-column:1/-1}
.wmain .body.grid2c>.opt.none{justify-self:start;width:calc(50% - 6px);margin-top:10px}
.wmain .body.grid2c>.qtitle{margin-bottom:6px}
.wmain .body.grid2c>.optgroup.on{grid-column:1/-1}
.wmain .body.k-badl{grid-template-columns:1fr}
.scorebar{background:#fff;border-radius:12px;padding:14px 18px!important;box-shadow:0 2px 8px rgba(33,51,115,.06)}
.wmain .body.k-status>div:first-child{max-width:520px}

/* =========================================================
   RISULTATI · SCHEDA PAZIENTE · CONFRONTO · REPORT · ACCOUNT
   ========================================================= */
.view[data-screen=results] .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px 24px;align-items:start}
.view[data-screen=results] .body>*{grid-column:1}
.view[data-screen=results] .body>.mods{grid-column:2;grid-row:1 / span 6}
.view[data-screen=results] .resfoot{margin:0;background:none;padding:0}
.view[data-screen=results] .foot{text-align:left}
.gauge{max-width:360px}
.view[data-screen=patient] .body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px 24px;align-items:start}
.view[data-screen=patient] .body>.between{grid-column:1/-1}
.view[data-screen=comparison] .body{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px 24px;align-items:start}
.view[data-screen=comparison] .body>.row{grid-column:1/-1}
.view[data-screen=report] .body{align-items:center}
.view[data-screen=report] .paper{width:100%;max-width:820px;padding:40px 48px}
.view[data-screen=report] .paper .phead{margin-bottom:16px}
.view[data-screen=report] .kv{font-size:14px;padding:4px 0}
.view[data-screen=account] .body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px;align-items:start;max-width:1040px}
.view[data-screen=account] .card.prof{grid-column:1/-1;padding:24px}
.view[data-screen=account] .btn.danger{grid-column:1/-1;justify-self:start;min-width:160px}
.onlyfull{display:flex}
.card.acct .arow.onlyfull{border-bottom:0}
.arow:hover span:not(.vv){color:var(--blue)}
.tlrow:hover b{color:var(--blue)}
.mh:hover .mtt b{color:var(--blue)}

/* =========================================================
   RESPONSIVE · larghezza dello schermo simulato
   ========================================================= */
@container app (max-width:1300px){
  #screen{--sbw:224px}
  .dpair{grid-template-columns:1fr}
  .drow.full{grid-template-columns:minmax(0,1fr) 150px 100px 100px 165px 24px 118px}
}
@container app (max-width:1100px){
  .dside{width:80px;padding:24px 12px;align-items:center}
  #screen.authed .view{left:80px}
  .dlogo{padding:0;width:40px;overflow:hidden}
  .dlogo svg{width:136px}
  .dni span,.dwho{display:none}
  .dni{width:52px;justify-content:center;padding:0}
  .duser{padding:6px;background:none;width:auto}
  .kpis{gap:16px}
  .dsearch{width:220px}
  .dgrid{grid-template-columns:minmax(0,1fr) 280px}
  .wiz{grid-template-columns:220px minmax(0,1fr);gap:24px}
}
@container app (max-width:900px){
  .hdr{padding:24px 24px 0}
  .crumb span{max-width:140px}
  .crumb{padding:0 6px;font-size:13px}
  .body,.dgrid,.wiz{padding-left:24px;padding-right:24px}
  .dpage{padding:24px 24px 36px;gap:24px}
  .dband{padding:24px;gap:24px}
  .bb{padding:12px 24px}
  .dtop{flex-wrap:wrap}
  .dhello{flex-basis:100%}
  .dtop .dsearch{flex:1;width:auto}
  .dcards,.dpair{grid-template-columns:1fr}
  .drow{grid-template-columns:minmax(0,1fr) 92px 96px 24px 112px}
  .drow.full{grid-template-columns:minmax(0,1fr) 92px 150px 24px 112px}
  .c-pt,.c-ag{display:none}
  .c-nm small.alt{display:block}
  .dgrid{grid-template-columns:1fr}
  .daside{position:static;order:-1}
  .dmain .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wiz{grid-template-columns:1fr;gap:20px}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
  .ritem{flex:none;width:auto;padding:8px 12px}
  .ritem+.ritem::before{display:none}
  .view[data-screen=results] .body,.view[data-screen=patient] .body,.view[data-screen=comparison] .body,.view[data-screen=account] .body{grid-template-columns:1fr}
  .view[data-screen=results] .body>.mods{grid-column:1;grid-row:auto}
  .view[data-screen=report] .paper{padding:28px 24px}
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .abrand{padding:36px 32px}
  .abrand h2{margin-top:56px;font-size:28px;line-height:35px}
  .aarc{width:70%;top:8%;right:-14%}
}

function animIn(el, frames, dur = 360) {
  if (RM.matches || !el.animate) return Promise.resolve();
  return el.animate(frames, { duration: dur, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }).finished.catch(() => {});

function mount(route, trans = 'push') {
  const def = SCREENS[route.name];
  const prev = R.view;
  const el = document.createElement('section');
  el.className = 'view';
  el.dataset.screen = route.name;
  el.innerHTML = def.render(route.params || {});
  screen.insertBefore(el, nav);
  R.view = el; R.def = def;
  wire(el, def, route.params || {});
  if (route.scroll && trans === 'pop') { const sc = el.querySelector('.scroll'); if (sc) sc.scrollTop = route.scroll; }
  def.init && def.init(el, route.params || {});
  setNav(route.name);
  if (!prev) return;
  prev.style.pointerEvents = 'none';
  const done = () => prev.remove();
  if (trans === 'push') {
    animIn(prev, [{ transform: 'translateX(0)', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(.92)' }]);
    animIn(el, [{ transform: 'translateX(100%)', boxShadow: '0 0 0 rgba(0,0,0,0)' }, { transform: 'translateX(0)', boxShadow: '-12px 0 30px rgba(0,0,0,.12)' }]).then(done);
  } else if (trans === 'pop') {
    screen.insertBefore(prev, nav); // old on top
    animIn(el, [{ transform: 'translateX(-28%)', filter: 'brightness(.92)' }, { transform: 'translateX(0)', filter: 'brightness(1)' }]);
    animIn(prev, [{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }]).then(done);
  } else if (trans === 'fade') {
    animIn(el, [{ opacity: 0, transform: 'scale(.985)' }, { opacity: 1, transform: 'scale(1)' }], 300).then(done);
  } else if (trans === 'up') {

  } else done();
}

function overlay(kind, html, opts = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const box = document.createElement('div'); box.className = kind; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  box.innerHTML = html;
  screen.appendChild(ov); screen.appendChild(box);
  requestAnimationFrame(() => requestAnimationFrame(() => { ov.classList.add('in'); box.classList.add('in'); }));
  let closed = false;
  const api = {
    el: box,
    close(cb) {
      if (closed) return; closed = true; opts.onClose && opts.onClose();
      ov.classList.remove('in'); box.classList.remove('in');
      const fin = () => { ov.remove(); box.remove(); cb && cb(); };
      if (RM.matches) fin(); else setTimeout(fin, kind === 'sheet' ? 380 : 260);
    },
    set(html2) { box.innerHTML = html2; }
  };
  if (opts.dismiss !== false) ov.addEventListener('click', () => api.close());
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const h = opts.actions && opts.actions[t.dataset.act];
    if (h) { e.preventDefault(); h(t, api); }
    else if (t.dataset.act === 'close') api.close();
  });
  if (opts.inputs) box.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && opts.inputs[t.dataset.in]) opts.inputs[t.dataset.in](t, api); });
  return api;
}

function dateBtnInner(iso, noIc) { return `${iso ? `<span>${isoToSlash(iso)}</span>` : '<span class="ph">gg/mm/aaaa</span>'}${noIc ? '' : ic('cal', 24)}`; }
function dateBtn(k, iso, noIc) { return `<button class="box sel datef" data-act="date" data-k="${k}" data-v="${iso || ''}" ${noIc ? 'data-noic="1"' : ''} aria-haspopup="dialog">${dateBtnInner(iso, noIc)}</button>`; }
function setDateBtn(t, iso) { t.dataset.v = iso; t.innerHTML = dateBtnInner(iso, t.dataset.noic); bump(t.querySelector('span')); }
function openDatePicker({ value, max, title = 'Seleziona la data' }, cb) {
  const today = isoDay(new Date());
  let sel = value || '';
  const st = D((sel || (max && max < today ? max : today)) + 'T12:00:00');
  let y = st.getFullYear(), m = st.getMonth();
  const long = iso => { const d = D(iso + 'T12:00:00'); return cap(`${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`); };
  const grid = () => {
    const off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
    let h = '<span></span>'.repeat(off);
    for (let d = 1; d <= n; d++) {
      const iso = `${y}-${p2(m + 1)}-${p2(d)}`;
      h += `<button data-act="day" data-iso="${iso}" class="${iso === sel ? 'on' : ''} ${iso === today ? 'today' : ''}" ${max && iso > max ? 'disabled' : ''} aria-label="${long(iso)}">${d}</button>`;
    }
    return h;
  };
  const nextDis = () => !!max && `${y}-${p2(m + 1)}` >= max.slice(0, 7);
  const html = `<div class="grab"></div><div class="between"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic('close', 22)}</button></div>
    <div class="shs" id="dpSel">${sel ? long(sel) : 'Seleziona un giorno dal calendario'}</div>
    <div class="calnav"><button data-act="prev" aria-label="Mese precedente">${ic('back', 20)}</button><b id="dpM">${MESI[m]} ${y}</b>
      <button data-act="next" id="dpNext" aria-label="Mese successivo" ${nextDis() ? 'disabled' : ''}>${ic('chev', 20)}</button></div>
    <div class="calwd">${['L','M','M','G','V','S','D'].map(c => `<span>${c}</span>`).join('')}</div>
    <div class="calwrap"><div class="caldays" id="dpG">${grid()}</div></div>
    <div class="btns" style="margin-top:16px"><button class="btn secondary" data-act="today">Oggi</button><button class="btn primary" data-act="ok" ${sel ? '' : 'disabled'}>Conferma</button></div>`;
  const paint = (api, dir) => {
    $('#dpM', api.el).textContent = `${MESI[m]} ${y}`; const g = $('#dpG', api.el); g.innerHTML = grid(); $('#dpNext', api.el).disabled = nextDis();
    if (dir) animIn(g, [{ opacity: 0, transform: `translateX(${dir * 32}px)` }, { opacity: 1, transform: 'none' }], 280);
  };
  const upd = api => { $('#dpSel', api.el).textContent = sel ? long(sel) : 'Seleziona un giorno dal calendario'; $('[data-act=ok]', api.el).disabled = !sel; };
  overlay('sheet', html, { actions: {
    prev(t, api) { if (--m < 0) { m = 11; y--; } paint(api, -1); },
    next(t, api) { if (++m > 11) { m = 0; y++; } paint(api, 1); },
    day(t, api) { sel = t.dataset.iso; $$('#dpG button', api.el).forEach(b => b.classList.toggle('on', b === t)); upd(api); },
    today(t, api) { sel = today; const d = new Date(); const dir = Math.sign((d.getFullYear() * 12 + d.getMonth()) - (y * 12 + m)); y = d.getFullYear(); m = d.getMonth(); paint(api, dir); upd(api); },
    ok(t, api) { api.close(); cb(sel); }
  } });
}
const metaPat = p => `${p.patologia} · ${ageOf(p)} anni · ${p.sesso}`;

function pcard(p, home = false) {
  const dr = isDraft(p);
  let line;
  if (dr) line = `<span class="metaline">Aggiornata: ${rel(p.assessment.updatedAt)}</span>`;
  else if (deceased(p) && !home) line = `<span class="metaline">Deceduto il ${isoToDisp(deceased(p).date)}</span>`;
  else line = `<span class="metaline">Validata il: ${fDate(p.assessment.validatedAt)}</span>`;
  return `<article class="pcard">
    <div><div class="code">${esc(fullName(p))}</div><div class="pat">${esc(p.patologia)}</div></div>
    <button class="iconbtn share" data-act="share" aria-label="Condividi">${ic('share', 20)}</button>
    <div class="meta"><span class="st ${dr ? '' : 'ok'}"><i></i>Stato: <b>${dr ? 'In corso' : 'Validata'}</b></span>${line}</div>
    <div class="act">${dr ? `<button class="btn primary sm" data-act="openP" data-code="${p.code}">Continua</button>`
      : `<button class="btn secondary sm" data-act="openP" data-code="${p.code}">Visualizza</button>`}</div>
  </article>`;
}
function openPatient(code, from) {
  const p = P(code); if (!p) return;
  if (isDraft(p)) go('assessment', { code });
  else go('patient', { code, from });
}

const F = { q: '', chip: 'all', pat: '', st: '', from: '2026-01-01', to: '' };
function filterPatients() {
  return S.patients.filter(p => {
    if (F.q && !fullName(p).toLowerCase().includes(F.q.toLowerCase().trim().replace(/\s+/g, ' '))) return false;
    if (F.chip === 'draft' && !isDraft(p)) return false;
    if (F.chip === 'validated' && isDraft(p)) return false;
    if (F.pat && p.patologia !== F.pat) return false;
    if (F.st === 'draft' && !isDraft(p)) return false;
    if (F.st === 'validated' && isDraft(p)) return false;
    if (F.st === 'dead' && !deceased(p)) return false;
    const c = isoDay(p.createdAt);
    if (F.from && c < F.from) return false;
    if (F.to && c > F.to) return false;
    return true;
  });
}
const advCount = () => (F.pat ? 1 : 0) + (F.st ? 1 : 0) + (F.from !== '2026-01-01' || F.to ? 1 : 0);
function patientsList() {
  const list = filterPatients();
  const dr = list.filter(isDraft).sort((a, b) => D(b.assessment.updatedAt) - D(a.assessment.updatedAt));
  const va = list.filter(p => !isDraft(p)).sort((a, b) => D(b.assessment.validatedAt) - D(a.assessment.validatedAt));
  if (!list.length) return `<div class="empty">Nessun paziente corrisponde alla ricerca.<br><button class="link" data-act="clearAll">Azzera ricerca e filtri</button></div>`;
  return `${dr.length ? `<div class="listhead" style="margin:0 0 4px">In corso</div>${dr.map(p => pcard(p)).join('')}` : ''}
    ${va.length ? `<div class="listhead" style="margin:${dr.length ? 20 : 0}px 0 4px">Validate</div>${va.map(p => pcard(p)).join('')}` : ''}`;
}

function openNewPatient() {
  const f = { nome: '', cognome: '', pat: '', dob: '', sesso: '' };
  const dobIso = () => parseDob(f.dob);
  const dobAge = () => { const iso = dobIso(); return iso ? ageOf({ nascita: iso }) : NaN; };
  const dobErr = () => {
    if (f.dob.length < 10) return '';
    const iso = dobIso(); if (!iso) return 'Data non valida';
    if (iso > isoDay(new Date())) return 'La data non può essere nel futuro';
    const a = dobAge(); if (a < 18) return 'Il paziente deve essere maggiorenne'; if (a > 120) return 'Data non valida';
    return '';
  };
  const valid = () => f.nome.trim() && f.cognome.trim() && f.pat && f.dob.length === 10 && !dobErr() && f.sesso;
  const txt = (k, label) => `<div class="field"><label for="np-${k}">${label}</label><div class="box"><input id="np-${k}" data-in="${k}" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(f[k])}"></div></div>`;
  const form = () => `<div class="grab"></div><div class="between"><h2>Nuovo paziente</h2><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic('close', 22)}</button></div>
    <div class="shs">Inserisci i dati per censire il paziente</div>
    <div class="form">
      ${txt('nome', 'Nome')}
      ${txt('cognome', 'Cognome')}
      ${selectBox('pat', 'Patologia cardiaca primaria', 'Seleziona la patologia', PATOLOGIE.map(x => [x, x]), f.pat)}

    <div class="btns"><button class="btn secondary" data-act="close">Annulla</button><button class="btn primary" data-act="create" ${valid() ? '' : 'disabled'}>Crea paziente</button></div>`;
  const updBtn = api => { $('[data-act=create]', api.el).disabled = !valid(); };
  const done = p => `<div class="grab"></div><div class="center" style="animation:fadein .35s both">

        <button class="link" data-act="home">Torna alla Home</button></div></div>`;
  // Step 0: liberatoria firmata dal paziente prima del censimento (testo segnaposto)
  let agreed = false;
  const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.';
  const LOREM2 = 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.';
  const consent = () => `<div class="grab"></div><div class="between"><h2>Liberatoria</h2><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic('close', 22)}</button></div>

      <h3>1. Finalità della valutazione</h3><p>${LOREM}</p><p>${LOREM2}</p>
      <h3>2. Trattamento dei dati personali</h3><p>${LOREM2}</p><p>${LOREM}</p>
      <h3>3. Diritti dell'interessato</h3><p>${LOREM}</p>
      <h3>4. Consenso</h3><p>${LOREM2}</p>
    </div>
    <button class="opt left agree ${agreed ? 'on' : ''}" data-act="agree" role="checkbox" aria-checked="${agreed}"><span class="cb">${ic('check', 14)}</span>Il paziente ha letto la liberatoria e acconsente al trattamento dei dati</button>
    <div class="btns"><button class="btn secondary" data-act="close">Annulla</button><button class="btn primary" data-act="next" ${agreed ? '' : 'disabled'}>Continua</button></div>`;

          S.patients.push(created); save();
          api.set(done(created));
          if (R.stack.length === 1 && ['home', 'patients'].includes(R.stack[0].name)) refresh();
        }, 500);
      },
      start: (t, api) => api.close(() => go('assessment', { code: created.code })),
      home: (t, api) => api.close(() => { if (!(R.stack.length === 1 && R.stack[0].name === 'home')) resetTo(['home'], 'fade'); })
    },
    inputs: {
      nome(t, api) { f.nome = t.value; updBtn(api); },
      cognome(t, api) { f.cognome = t.value; updBtn(api); },
      dob(t, api) { // maschera gg/mm/aaaa: inserisce le barre da sola
        const d = t.value.replace(/\D/g, '').slice(0, 8);
        t.value = d.slice(0, 2) + (d.length > 2 ? '/' + d.slice(2, 4) : '') + (d.length > 4 ? '/' + d.slice(4) : '');
        f.dob = t.value;
        const err = dobErr();
        const box = $('#np-dobbox', api.el), e = $('#np-doberr', api.el);
        box.classList.toggle('bad', !!err); e.hidden = !err; e.textContent = err;

}

function mrow(p, k, g) {

  const sc = st === 'done' && d.score ? `<small>${d.lab || 'Punteggio'}: <b>${d.score(p)}</b></small>` : '';
  return `<button class="mrow" data-act="open" data-g="${g}" data-k="${k}">${st === 'done' ? ic('checkCircle', 30, 'ck') : ''}

}

    </div></div>
    <div class="bb ${ok ? 'nob' : ''}"><div class="btns"><button class="btn primary" data-act="validate" ${ok ? '' : 'disabled'}>${rv ? 'Valida e ricalcola risultati' : ok ? 'Valida e calcola risultati' : 'Valida valutazione'}</button></div>

  return Calc.badl(f.badl) !== null && Calc.mna(f.mna) !== null && fuDiagOk(f, 'labs') && fuDiagOk(f, 'echo'); }

const R_STEP = {

const fldScore = (o, na) => na ? 'N/A' : `${Object.values(o).filter(v => v !== '').length} / 5`;
const thScore = s => { const n = s.therapy.filter(Boolean).length; return n ? `${n}` : s.therapyNone ? '0' : '-'; };
function noneOpt(act, on) { return `<button class="opt left none ${on ? 'on' : ''}" data-act="${act}"><span class="cb">${ic('check', 14)}</span>Nessuna delle precedenti</button>`; }

animIn = function (el, frames, dur = 360) {
  const tf = frames.map(f => f.transform || '');
  if (tf.some(t => /translateX\(-?\d+%\)/.test(t))) {
    if (RM.matches || !el.animate) return Promise.resolve();
    const out = !/translateX\(0\)|none/.test(tf[tf.length - 1]);
    const fr = out ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }];
    return el.animate(fr, { duration: out ? 160 : 240, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }).finished.catch(() => {});
  }
  return animInMobile(el, frames, dur);
};

// la "A" del logo (gamba, curva, tratto interno e coda) come elemento grafico
const A_MARK = `<svg viewBox="69.4 3.1 38.1 34.7" fill="currentColor" aria-hidden="true">${LOGO.match(/<path[^>]*>/g).slice(7, 11).join('')}</svg>`;
const authBrand = () => `<div class="abrand"><div class="alogo">${LOGO}</div><div class="amark">${A_MARK}</div>
  <h2>Valutazione geriatrica completa per le malattie cardiovascolari</h2></div>`;
SCREENS.login.render = () => `<div class="auth">${authBrand()}
  <div class="aform"><div class="ain">
    <h1>Accedi</h1><p class="lead">Inserisci le credenziali fornite dal tuo centro.</p>
    <div class="form">
      <div class="field"><label for="em">Email istituzionale</label><div class="box"><input id="em" type="email" value="${DOC.email}" autocomplete="username"></div></div>
      <div class="field"><label for="pw">Password</label><div class="box"><input id="pw" type="password" value="demo-cgassist" autocomplete="current-password">
        <button class="iconbtn" data-act="eye" aria-label="Mostra password" style="color:var(--blue);padding:0">${ic('eye', 24)}</button></div></div>
      <div style="margin-top:-8px"><button class="link" data-act="na" style="font-size:13px;padding:4px 0">Password dimenticata?</button></div>
    </div>
    <button class="btn primary" data-act="login">Accedi</button>
  </div></div></div>`;
SCREENS.twofa.render = () => `<div class="auth">${authBrand()}
  <div class="aform"><div class="ain">
    <button class="back" data-act="back">${ic('back', 16)}Torna indietro</button>
    <div class="circ lg">${ic('shield', 34)}</div>
    <h1>Verifica in due passaggi</h1>
    <p class="lead">Inserisci il codice a 6 cifre che hai ricevuto all’email ${DOC.email}.</p>
    <div class="otp" id="otp">${'<input inputmode="numeric" maxlength="1" aria-label="Cifra">'.repeat(6)}</div>
    <div class="muted" style="font-size:13px" id="resend">Non hai ricevuto il codice? <b style="color:var(--text);font-weight:600">Riprova tra <span id="cd">00:45</span></b></div>
    <button class="btn primary" data-act="verify" id="vbtn" disabled>Verifica e accedi</button>
  </div></div></div>`;

/* ---------- tabelle pazienti ---------- */
function stCell(p) {
  if (isDraft(p)) return `<span class="c-st"><span class="sdot"></span>In corso</span>`;
  return `<span class="c-st"><span class="sdot ok"></span>Validata</span>`;
}
function dtCell(p, full) { // come le card mobile: in elenco pazienti il decesso sostituisce la data di validazione
  if (isDraft(p)) return capF(rel(p.assessment.updatedAt));
  if (deceased(p) && full) return `Deceduto il ${isoToDisp(deceased(p).date)}`;
  return fDate(p.assessment.validatedAt);
}
function drow(p, full) {
  const dr = isDraft(p);
  return `<div class="drow ${full ? 'full' : ''}" role="row">
    <span class="c-nm" role="cell"><b>${esc(fullName(p))}</b><small class="alt">${esc(p.patologia)}</small></span>
    <span class="c-pt" role="cell">${esc(p.patologia)}</span>
    ${full ? `<span class="c-ag" role="cell">${ageOf(p)} anni · ${p.sesso}</span>` : ''}
    <span role="cell">${stCell(p)}</span>
    <span class="c-dt" role="cell">${dtCell(p, full)}</span>
    <button class="iconbtn share" data-act="share" aria-label="Condividi ${esc(fullName(p))}">${ic('share', 20)}</button>
    <button class="btn sm ${dr ? 'primary' : 'secondary'}" data-act="openP" data-code="${p.code}">${dr ? 'Continua' : 'Visualizza'}</button>
  </div>`;
}
const dhead = (dateLab, full) => `<div class="drow th ${full ? 'full' : ''}" role="row"><span>Paziente</span><span class="c-pt">Patologia</span>${full ? '<span class="c-ag">Età e sesso</span>' : ''}<span>Stato</span><span>${dateLab}</span><span></span><span class="sr">Azioni</span></div>`;
function dpanel(title, list, total, dateLab, f, emptyTxt) {
  return `<section class="panel" role="table" aria-label="${title}">
    <div class="phd"><h2>${title}</h2>${total ? `<button class="link" data-act="all" data-f="${f}">Tutte</button>` : ''}</div>
    ${list.length ? dhead(dateLab) + list.map(p => drow(p)).join('') : `<div class="empty">${emptyTxt}</div>`}</section>`;
}

/* ---------- home ---------- */
const greet = () => { const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; };
SCREENS.home.render = function () {
  const drafts = S.patients.filter(isDraft).sort((a, b) => D(b.assessment.updatedAt) - D(a.assessment.updatedAt));
  const valid = S.patients.filter(p => !isDraft(p)).sort((a, b) => D(b.assessment.validatedAt) - D(a.assessment.validatedAt));
  const kpi = (l, v, dot, go, aria) => `<button class="kpi" data-act="kpi" data-go="${go}" aria-label="${l}: ${v}. ${aria}"><span class="go" aria-hidden="true">${ic('chev', 18)}</span><span class="l"><span class="sdot ${dot}"></span>${l}</span><span class="v">${v}</span></button>`;
  return `<div class="scroll"><div class="dpage"><div class="dband">
    <div class="dtop">
      <div class="dhello"><h1>${DOC.name}</h1><p>${DOC.centro}</p></div>
      <button class="btn primary" data-act="new">${ic('plus', 20)}Censisci nuovo paziente</button>
    </div>
    <div class="kpis">
      ${kpi('Valutazioni in corso', drafts.length, '', 'draft', 'Apri le valutazioni in corso')}
      ${kpi('Valutazioni validate', valid.length, 'ok', 'validated', 'Apri le valutazioni validate')}
    </div></div>
    ${dpanel('Valutazioni in corso', drafts.slice(0, 5), drafts.length, 'Aggiornata', 'draft', 'Nessuna valutazione in corso. <button class="link" data-act="new">Censisci un nuovo paziente</button>')}
    ${dpanel('Valutazioni concluse', valid.slice(0, 5), valid.length, 'Validata il', 'validated', 'Le valutazioni validate compariranno qui.')}
  </div></div>`;
};
SCREENS.home.inputs = {
  q(t) { // la ricerca porta all’elenco pazienti, con il testo già inserito
    Object.assign(F, { q: t.value, chip: 'all' }); resetTo([{ name: 'patients', params: {} }], 'none');
    const i = $('[data-in=q]', R.view); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
};

/* ---------- pazienti ---------- */
patientsList = function () {
  const list = filterPatients();
  if (!list.length) return `<div class="empty">Nessun paziente corrisponde alla ricerca. <button class="link" data-act="clearAll">Azzera ricerca e filtri</button></div>`;
  const dr = list.filter(isDraft).sort((a, b) => D(b.assessment.updatedAt) - D(a.assessment.updatedAt));
  const va = list.filter(p => !isDraft(p)).sort((a, b) => D(b.assessment.validatedAt) - D(a.assessment.validatedAt));
  return dhead('Ultima data', true) + [...dr, ...va].map(p => drow(p, true)).join('');
};
SCREENS.patients.render = function (prm) {
  if (prm.chip) { F.chip = prm.chip; delete prm.chip; }
  const n = advCount();
  return `${header({ title: 'Pazienti', sub: `${DOC.centro} · ${S.patients.length} pazienti censiti`, action: `<button class="btn primary" data-act="new">${ic('plus', 20)}Censisci nuovo paziente</button>` })}
    <div class="scroll"><div class="dpage">
      <div class="dtools">
        <label class="dsearch">${ic('search', 20)}<input data-in="q" placeholder="Cerca" value="${esc(F.q)}" aria-label="Cerca per nome o cognome"></label>
        <div class="chips" role="tablist" aria-label="Stato della valutazione">${CHIPS.map(([k, l]) => `<button class="chip ${F.chip === k ? 'on' : ''}" data-act="chip" data-k="${k}" role="tab" aria-selected="${F.chip === k}">${l}</button>`).join('')}</div>
        ${F.fu ? `<button class="fpill" data-act="clearFu" aria-label="Rimuovi il filtro con follow-up">Con follow-up ${ic('close', 16)}</button>` : ''}
        <button class="fbtn" data-act="filters" aria-label="Filtra pazienti" title="Filtra pazienti">${ic('tune', 22)}${n ? '<span class="dot"></span>' : ''}</button>
      </div>
      <section class="panel" role="table" aria-label="Elenco pazienti"><div id="plist">${patientsList()}</div></section>
    </div></div>`;
};
SCREENS.patients.actions.new = () => openNewPatient();
/* scorciatoie delle card riepilogo: aprono l’elenco pazienti già filtrato */
F.fu = false;
const filterPatientsBase = filterPatients;
filterPatients = () => filterPatientsBase().filter(p => !F.fu || p.followups.length);
SCREENS.home.actions.kpi = t => {
  const go = t.dataset.go;
  Object.assign(F, { q: '', pat: '', st: '', from: '2026-01-01', to: '', chip: go === 'draft' || go === 'validated' ? go : 'all', fu: go === 'fu' });
  resetTo([{ name: 'patients', params: {} }], 'fade');
};
SCREENS.patients.actions.clearFu = () => { F.fu = false; refresh(); };
const clearAllBase = SCREENS.patients.actions.clearAll;
SCREENS.patients.actions.clearAll = (...a) => { F.fu = false; clearAllBase(...a); };

/* ---------- valutazione (bozza o revisione) ---------- */
SCREENS.assessment.render = function ({ code, review }) {
  const p = P(code), a = p.assessment;
  const rv = !isDraft(p), edited = rv && D(a.updatedAt) > D(a.validatedAt);
  const cDone = CGA_KEYS.filter(k => secState(p, k) === 'done').length, dDone = DIARY_KEYS.filter(k => secState(p, k) === 'done').length;
  const ok = allDone(p), what = hasGass(p) ? 'GASS-TAVR, fenotipo di vulnerabilità' : 'Fenotipo di vulnerabilità';
  return `${header({ back: review ? { label: 'Scheda paziente' } : { label: rootLabel(), act: 'home' }, title: fullName(p), sub: `Valutazione baseline · ${metaPat(p)}` })}
  <div class="scroll"><div class="dgrid">
    <div class="dmain">
      <div class="card"><div class="chead"><h3>Dati paziente</h3><button class="link" data-act="na">Modifica</button></div>
        <div class="grid2"><div><small>Nome e cognome</small><b>${esc(fullName(p))}</b></div><div><small>Patologia</small><b>${esc(p.patologia)}</b></div>
        <div><small>Data di nascita</small><b>${p.nascita ? isoToSlash(p.nascita) : '-'}</b></div><div><small>Sesso</small><b>${p.sesso === 'M' ? 'Maschio' : 'Femmina'}</b></div></div></div>
      <div class="dpair">
        <div class="card"><div class="chead"><h3>CGA · Valutazione geriatrica</h3><span class="cnt">${cDone} / 3</span></div>
          <div class="mrows">${CGA_KEYS.map(k => mrow(p, k, 'cga')).join('')}</div></div>
        <div class="card"><div class="chead"><h3>Dati clinico strumentali</h3><span class="cnt">${dDone} / 4</span></div>
          <div class="mrows">${DIARY_KEYS.map(k => mrow(p, k, 'diary')).join('')}</div></div>
      </div>
    </div>
    <aside class="daside"><div class="card vpanel">
      <div class="between">${rv ? badge('ok') : badge('wip')}</div>
      <span class="metaline" style="margin-top:-8px">${rv ? (edited ? `Modificata: ${rel(a.updatedAt)}` : `Validata il: ${fDate(a.validatedAt)}`) : `Salvato automaticamente: ${rel(a.updatedAt)}`}</span>
      <div class="vprog"><div class="between"><span>CGA</span><b>${cDone} / 3</b></div>${segs(3, cDone, 'csegs')}</div>
      <div class="vprog"><div class="between"><span>Dati clinico strumentali</span><b>${dDone} / 4</b></div>${segs(4, dDone, 'csegs')}</div>
      <div class="lockline">${ic('lock', 18)}<span>${rv ? `Risultati calcolati il ${fDate(a.validatedAt)}. ${what} e Charlson saranno ricalcolati alla nuova validazione.` : `${what} e Charlson saranno calcolati alla validazione.`}</span></div>
      <button class="btn primary" data-act="validate" ${ok ? '' : 'disabled'}>${rv ? 'Valida e ricalcola risultati' : ok ? 'Valida e calcola risultati' : 'Valida valutazione'}</button>
      ${ok ? '' : '<p class="cap2">Completa CGA e dati clinico strumentali per validare la valutazione.</p>'}
    </div></aside>
  </div></div>`;
};

/* ---------- compilazione: barra delle sezioni + modulo ---------- */
const ST_LAB = { done: 'Completato', part: 'In corso', todo: 'Da compilare' };
const GRID_STEPS = ['charlson', 'therapy', 'labs', 'echo'];
SCREENS.step.render = function ({ code, g, i }) {
  const p = P(code), st = STEPS[g][i], s = src(p, g);
  const n = g === 'fu' ? fuSteps(p) : STEPS[g].length, last = i === n - 1;
  const dis = g === 'fu' && last && !fuReady(p) ? 'disabled' : '';
  const rail = STEPS[g].slice(0, n).map((x, j) => {
    const state = g === 'fu' ? (j < i ? 'done' : 'todo') : secState(p, x.k);
    const sub = g === 'fu' ? (j < i ? 'Compilato' : j === i ? 'In compilazione' : 'Da compilare') : ST_LAB[state];
    return `<button class="ritem ${state} ${j === i ? 'on' : ''}" data-act="jump" data-i="${j}" ${j === i ? 'aria-current="step"' : ''}>
      <span class="rn">${state === 'done' && j !== i ? ic('check', 14) : j + 1}</span><span class="rt"><b>${x.t}</b><small>${sub}</small></span></button>`;
  }).join('');
  const cls = [`k-${st.k}`, GRID_STEPS.includes(st.k) ? 'grid2c' : '', ['mna', 'sppb', 'status'].includes(st.k) ? 'g20' : 'g10'].join(' ');
  return `<header class="hdr"><div class="top">${crumbs()}</div>
      <div class="trow"><div><h1>${GROUP_LAB[g]}</h1><div class="sub">${esc(fullName(p))} · ${g === 'fu' ? `Follow-up ${p.followups.length + 1}` : 'Valutazione baseline'}</div></div>
      <button class="btn secondary sm" data-act="saveexit">Salva ed esci</button></div></header>
    <div class="scroll"><div class="wiz">
      <nav class="rail" aria-label="Sezioni di ${GROUP_LAB[g]}">${rail}</nav>
      <div class="wmain">
        <div class="whead"><span class="wc">Sezione ${i + 1} di ${n}</span><h2>${st.t}</h2>${st.s ? `<p>${st.s}</p>` : ''}</div>
        <div class="body ${cls}">${R_STEP[st.k](p, s)}</div>
      </div>
    </div></div>
    <div class="bb nob"><div class="btns">${btn('Precedente', 'prev', i === 0 ? 'ghost' : 'secondary')}${btn(last ? LAST_LAB[g] : 'Successivo', 'next', 'primary', `id="nextb" ${dis}`)}</div></div>`;
};
SCREENS.step.actions.jump = function (t, prm) {
  const j = +t.dataset.i; if (j === prm.i) return;
  const p = P(prm.code); stopChrono(); markLeave(p, prm.g, STEPS[prm.g][prm.i].k);
  replace('step', { ...prm, i: j }, 'none');
};
SCREENS.step.init = () => {};

/* ---------- risultati: stato in alto a destra ---------- */
const resRenderMobile = SCREENS.results.render;
SCREENS.results.render = function (prm) {
  let h = resRenderMobile(prm);
  const m = h.match(/<div class="between"><span class="badge ok"><i><\/i>Validata<\/span><span class="metaline">[^<]*<\/span><\/div>/);
  if (m) { h = h.replace(m[0], ''); h = h.replace('<div class="hact">', `<div class="hact"><div class="hstat">${m[0]}</div>`); }
  return h;
};
/* ---------- risultati: moduli già aperti su desktop ---------- */
const resInitMobile = SCREENS.results.init;
SCREENS.results.init = function (el, prm) {
  $$('.mod', el).forEach(m => { m.classList.add('open'); const h = $('.mh', m); h && h.setAttribute('aria-expanded', 'true'); });
  resInitMobile(el, prm);
};

/* =========================================================
   BOOT · formato schermo
   ========================================================= */
const MODES = { land: { w: 1194, h: 834 }, port: { w: 834, h: 1194 }, desk: { w: 1440, h: 900 } };
let mode = 'land';
try { mode = localStorage.getItem('cgassist-tablet-mode') || 'land'; } catch (e) {}
if (!MODES[mode]) mode = 'land';
const FULL = new URLSearchParams(location.search).has('full') || (matchMedia('(pointer:coarse)').matches && innerWidth >= 744 && innerWidth <= 1400);
if (FULL) document.body.classList.add('full');
function fitT() {
  if (FULL) return;
  const m = MODES[mode], dev = document.getElementById('tdev');
  dev.classList.toggle('desk', mode === 'desk');
  screen.style.width = m.w + 'px'; screen.style.height = m.h + 'px';
  const fw = mode === 'desk' ? m.w : m.w + 28, fh = mode === 'desk' ? m.h + 34 : m.h + 28;
  const s = Math.min(1, (innerWidth - 48) / fw, (innerHeight - 64 - 24) / fh);
  dev.style.transform = `scale(${s})`;
  const w = document.getElementById('twrap'); w.style.width = fw * s + 'px'; w.style.height = fh * s + 'px';
  $$('.seg button').forEach(b => { const on = b.dataset.mode === mode; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
$('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; try { localStorage.setItem('cgassist-tablet-mode', mode); } catch (e) {}
  fitT();
});
addEventListener('resize', fitT);
fitT();
$('#tReset').innerHTML = `${ic('reset', 16)}Ripristina dati demo`;
$('#tReset').addEventListener('click', () => confirmReset());
$('#tLogin').innerHTML = `${ic('logout', 16)}Ricomincia dal login`;
$('#tLogin').addEventListener('click', () => { $$('.ov,.sheet,.modal', screen).forEach(n => n.remove()); resetTo(['login'], 'fade'); });

S = load(); save();
resetTo(['login'], 'none');
</script>
